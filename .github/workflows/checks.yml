name: Check browser application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /PriceLens/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pricelens-web
          path: webapp/dist
          include-hidden-files: true
          retention-days: 7
